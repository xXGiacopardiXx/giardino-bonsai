<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#bfe0ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bonsai">
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icone/icona-192.png">
  <title>Giardino Bonsai</title>
</head>
<body>
  <main class="screen" id="screen">
    <canvas id="c" aria-label="Giardino bonsai in 3D: acero, ginepro e pino nero su un'isola fluttuante"></canvas>
    <div class="fallback" id="fallback">Il tuo telefono non supporta WebGL, quindi la scena 3D non può essere mostrata.</div>

    <div class="tags" id="tags">
      <div class="tag" id="tag-acero">
        <div class="alert" id="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C16 8 18.5 11.5 18.5 14.5a6.5 6.5 0 0 1-13 0C5.5 11.5 8 8 12 3Z" fill="#5db4f0" stroke="#1d4f7a" stroke-width="2"/></svg>Ha sete!</div>
        <div class="ok" id="ok">Idratato</div>
        <div class="plate"><span class="nm">Acero giapponese</span><span class="fase" id="acero-fase">Sta bene</span>
          <span class="misura" title="Acqua nel terriccio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C16 8 18.5 11.5 18.5 14.5a6.5 6.5 0 0 1-13 0C5.5 11.5 8 8 12 3Z" fill="#5db4f0" stroke="#1d4f7a" stroke-width="2.4"/></svg><span class="bar acqua"><i id="acero-acqua" style="width:100%"></i></span></span>
          <span class="misura" title="Chioma"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 5 4.8-2-1.8 5 4.8 1.8-4.6 2.4 1.6 4.8-5-2.2L12 22l-2-5.2-5 2.2 1.6-4.8L2 11.8 6.8 10 5 5l4.8 2Z" fill="#6fae3e" stroke="#3b2716" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="bar"><i id="acero-barra" style="width:100%"></i></span><b id="acero-salute">100%</b></span>
        </div>
        <div class="menu-pianta" id="menu-acero" hidden>
          <button class="mp acqua" data-a="acqua"><span class="mp-b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C16 8 18.5 11.5 18.5 14.5a6.5 6.5 0 0 1-13 0C5.5 11.5 8 8 12 3Z" fill="#eaf7ff" stroke="#1d4f7a" stroke-width="2"/></svg></span><span class="mp-l">Acqua</span></button>
          <button class="mp" data-a="pota"><span class="mp-b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 14.6 18.5 3.5M14.8 14.6 5.5 3.5" stroke="#7d8a92" stroke-width="2.6" stroke-linecap="round"/><circle cx="7.5" cy="17.5" r="3" fill="#e2483a" stroke="#3b2716" stroke-width="1.8"/><circle cx="16.5" cy="17.5" r="3" fill="#e2483a" stroke="#3b2716" stroke-width="1.8"/></svg></span><span class="mp-l">Pota</span></button>
          <button class="mp" data-a="filo"><span class="mp-b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c2-8 5.5-8 5.5-4s4 4 4-2.5S18 6 20.5 4" stroke="#3b2716" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M4 19c2-8 5.5-8 5.5-4s4 4 4-2.5S18 6 20.5 4" stroke="#d07a3a" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span><span class="mp-l">Filo</span></button>
          <button class="mp" data-a="aspetto"><span class="mp-b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16l-2.4 8H6.4Z" fill="#4c7891" stroke="#3b2716" stroke-width="1.8" stroke-linejoin="round"/><rect x="3" y="9" width="18" height="3" rx="1.5" fill="#5f8ea8" stroke="#3b2716" stroke-width="1.6"/><path d="M12 9c0-3 1-4 0-6" stroke="#6b5444" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="9.5" cy="4" r="2.4" fill="#e3462a" stroke="#3b2716" stroke-width="1.2"/><circle cx="14.5" cy="3.6" r="2.4" fill="#f0702c" stroke="#3b2716" stroke-width="1.2"/></svg></span><span class="mp-l">Aspetto</span></button>
        </div>
      </div>
      <div class="tag" id="tag-ginepro"><div class="plate"><span class="nm">Ginepro</span><span class="st"><span>Moyogi</span><span>72%</span></span><div class="bar"><i style="width:72%"></i></div></div></div>
      <div class="tag" id="tag-pino"><div class="plate"><span class="nm">Pino nero</span><span class="st"><span>Shakan</span><span>64%</span></span><div class="bar"><i style="width:64%"></i></div></div></div>
    </div>

    <div class="hud">
      <div class="row">
        <div class="pill season">
          <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2 6 6-2-3 5 5 2-6 2 1 6-5-4-5 4 1-6-6-2 5-2-3-5 6 2z" fill="#d9481f" stroke="#3b2716" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 17v5" stroke="#3b2716" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <b id="stagione">Primavera</b>
          <span class="week" id="settimana" aria-label="Giorno 1 di 7"><i class="now"></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="pill seeds">
          <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.5 3 6 7 6 10.5A6 6 0 0 1 6 13.5C6 10 7.5 6 12 3Z" fill="#a8641f" stroke="#3b2716" stroke-width="1.8"/><path d="M10 9c-1 2-1.4 4-1 6" stroke="#f3c77a" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
          <b id="seeds">50</b>
          <button class="plus" id="plus" aria-label="Ottieni semi">+</button>
        </div>
      </div>
      <div class="pill streak">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-2-1-5 0-7Z" fill="#ff8a2a" stroke="#3b2716" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 13c1.2 1.4 2 2.4 2 3.4a2 2 0 0 1-4 0c0-1 .8-2 2-3.4Z" fill="#ffe07a"/></svg></span>
        <b id="serie">0</b><span>giorni di fila</span>
      </div>
      <div class="quest" id="quest">
        <span class="qt">Sfida del giorno</span>
        <span class="qd">Annaffia l'acero</span>
        <span class="qr">+5<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.5 3 6 7 6 10.5A6 6 0 0 1 6 13.5C6 10 7.5 6 12 3Z" fill="#a8641f" stroke="#3b2716" stroke-width="2"/></svg></span>
        <span class="qbar"><i id="qfill"></i><span id="qtxt">0/1</span></span>
      </div>
    </div>

    <button class="suoni-b" id="suoni" aria-label="Suoni accesi" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="#f4c55a" stroke="#3b2716" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#3b2716" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
    <button class="suoni-b musica-b" id="musica" aria-label="Musica accesa" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12" stroke="#3b2716" stroke-width="1.8" fill="none" stroke-linejoin="round"/><ellipse cx="6.5" cy="17.5" rx="3" ry="2.4" fill="#7cc4e8" stroke="#3b2716" stroke-width="1.6"/><ellipse cx="16.5" cy="15.5" rx="3" ry="2.4" fill="#7cc4e8" stroke="#3b2716" stroke-width="1.6"/></svg></button>

    <div class="hint" id="hint">Trascina per ruotare · pizzica per lo zoom</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <nav class="toolbar" aria-label="Azioni di cura">
      <button class="tool water needs" id="t-water"><span class="b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C16 8 18.5 11.5 18.5 14.5a6.5 6.5 0 0 1-13 0C5.5 11.5 8 8 12 3Z" fill="#eaf7ff" stroke="#1d4f7a" stroke-width="2"/><path d="M9 14.5a3 3 0 0 0 2 2.8" stroke="#5db4f0" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></span><span class="l">Acqua</span></button>
      <button class="tool" id="t-prune"><span class="b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 14.6 18.5 3.5M14.8 14.6 5.5 3.5" stroke="#7d8a92" stroke-width="2.6" stroke-linecap="round"/><path d="M9.2 14.6 18.5 3.5M14.8 14.6 5.5 3.5" stroke="#3b2716" stroke-width="1" stroke-linecap="round" fill="none"/><circle cx="7.5" cy="17.5" r="3" fill="#e2483a" stroke="#3b2716" stroke-width="1.8"/><circle cx="16.5" cy="17.5" r="3" fill="#e2483a" stroke="#3b2716" stroke-width="1.8"/></svg></span><span class="l">Pota</span></button>
      <button class="tool" id="t-wire"><span class="b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c2-8 5.5-8 5.5-4s4 4 4-2.5S18 6 20.5 4" stroke="#3b2716" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M4 19c2-8 5.5-8 5.5-4s4 4 4-2.5S18 6 20.5 4" stroke="#d07a3a" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span><span class="l">Filo</span></button>
      <button class="tool" id="t-care"><span class="b"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="10" width="9" height="11" rx="2.4" fill="#8fd16a" stroke="#3b2716" stroke-width="1.8"/><path d="M9 10V7h5l2.5 2" stroke="#3b2716" stroke-width="1.8" fill="#f4e2b8" stroke-linejoin="round"/><circle cx="19.5" cy="6.5" r="1" fill="#3b2716"/><circle cx="21" cy="9.5" r="1" fill="#3b2716"/><path d="M10 14h3M11.5 12.5v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="l">Cura</span></button>
      <button class="tool" id="t-shop"><span class="b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9h15l-1.2 11.2H5.7Z" fill="#f4c55a" stroke="#3b2716" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 9V7a3 3 0 0 1 6 0v2" stroke="#3b2716" stroke-width="1.8" fill="none"/></svg></span><span class="l">Negozio</span></button>
    </nav>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
